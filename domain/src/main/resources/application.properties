spring.application.name=delivery-domain
# Ingen web-server i Java. Eneste indgang er gRPC.
spring.main.web-application-type=none

spring.datasource.url=jdbc:postgresql://localhost:5432/delivery
spring.datasource.username=delivery
spring.datasource.password=delivery

# Proof of concept: Hibernate opretter tabellerne. Migreringer kommer senere.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

grpc.port=9090
